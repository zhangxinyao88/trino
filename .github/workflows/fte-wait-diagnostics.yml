name: Verify FTE wait diagnostics
on:
  push:
    branches: [codex/trino-fte-wait-diagnostics]
permissions:
  contents: read
concurrency:
  group: verify-fte-wait-diagnostics
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'zhangxinyao88/trino'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 71a2e65130273178a6dbc44b50edc0cddc2568d6
          path: source
          persist-credentials: false
      - name: Verify native host and source
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.Architecture}}')" = x86_64
          test "$(git -C source rev-parse HEAD)" = 71a2e65130273178a6dbc44b50edc0cddc2568d6
          mkdir evidence
          { uname -a; lscpu; free -h; df -h .; git -C source rev-parse HEAD; } > evidence/host.txt
      - name: Verify diagnostic code and FTE suite
        run: |
          docker run --rm --name verify-fte --cpus 4 --memory 12g \
            --hostname trino-ci --add-host trino-ci:127.0.0.1 \
            -v "$PWD/source:/source" -v "$PWD/harness:/harness:ro" -v "$PWD/evidence:/evidence" \
            eclipse-temurin@sha256:952ae4db91699d916ee219f7830c424022c9eb8792d35899af97316b8000a078 \
            bash /harness/.github/bin/verify-fte-wait-diagnostics.sh
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fte-wait-diagnostics
          path: |
            evidence/
            source/core/trino-main/target/surefire-reports/
            source/testing/trino-faulttolerant-tests/target/surefire-reports/
          retention-days: 7
          if-no-files-found: error
